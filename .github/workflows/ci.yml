name: Propane Tracker CI

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 6 */3 * *' # run every 3 days at 06:00 UTC (adjust as desired)

jobs:
  check-and-refill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build

      - name: Run checker
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          USERNAME: ${{ vars.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LOGIN_USERNAME_SELECTOR: ${{ vars.LOGIN_USERNAME_SELECTOR }}
          LOGIN_PASSWORD_SELECTOR: ${{ vars.LOGIN_PASSWORD_SELECTOR }}
          LOGIN_SUBMIT_SELECTOR: ${{ vars.LOGIN_SUBMIT_SELECTOR }}
          TANK_LEVEL_SELECTOR: ${{ vars.TANK_LEVEL_SELECTOR }}
          TANK_THRESHOLD: ${{ vars.TANK_THRESHOLD }}
          REFILL_BUTTON_SELECTOR: ${{ vars.REFILL_BUTTON_SELECTOR }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

        run: |
          set -e
          npm run ci

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propane-artifacts
          path: artifacts/**
